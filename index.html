<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Purchase order tracker</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg: #F4F5F1;
      --surface: #FFFFFF;
      --border: #E1E3DC;
      --border-strong: #CBCFC5;
      --ink: #1C2119;
      --ink-muted: #5C6457;
      --ink-faint: #8A9080;
      --accent: #0F6E56;
      --accent-soft: #E1F5EE;
      --accent-ink: #085041;
      --warn: #9A5B0C;
      --warn-soft: #FAEEDA;
      --danger: #A32D2D;
      --danger-soft: #FCEBEB;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      line-height: 1.55;
      padding: 32px 24px 80px;
      min-height: 100vh;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 28px;
      gap: 16px;
      flex-wrap: wrap;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .sub {
      color: var(--ink-muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 11px 18px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity .15s;
    }

    .btn:hover {
      opacity: .88;
    }

    .btn.ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--border-strong);
    }

    .btn.small {
      padding: 6px 12px;
      font-size: 12.5px;
      border-radius: 7px;
    }

    .btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
    }

    .stat .num {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 26px;
      font-weight: 600;
    }

    .stat .lbl {
      font-size: 12px;
      color: var(--ink-muted);
      margin-top: 2px;
    }

    .stat.warn .num {
      color: var(--warn);
    }

    .stat.danger .num {
      color: var(--danger);
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .row-head {
      display: grid;
      grid-template-columns: 34px 1.3fr 1fr 1.1fr 1fr 1.5fr 1fr 32px;
      gap: 8px;
      padding: 11px 16px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--ink-faint);
      border-bottom: 1px solid var(--border);
    }

    .order-row {
      border-bottom: 1px solid var(--border);
    }

    .order-row:last-child {
      border-bottom: none;
    }

    .order-summary {
      display: grid;
      grid-template-columns: 34px 1.3fr 1fr 1.1fr 1fr 1.5fr 1fr 32px;
      gap: 8px;
      padding: 14px 16px;
      align-items: center;
      cursor: pointer;
    }

    .order-summary:hover {
      background: #FAFAF8;
    }

    .stamp {
      display: flex;
      gap: 3px;
    }

    .tick {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: 1px solid var(--border-strong);
      flex-shrink: 0;
    }

    .tick.done {
      background: var(--accent);
      border-color: var(--accent);
    }

    .tick.overdue {
      background: var(--danger);
      border-color: var(--danger);
    }

    .pid {
      font-weight: 600;
    }

    .pdate {
      color: var(--ink-muted);
      font-size: 13px;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 5px;
    }

    .badge.ok {
      background: var(--accent-soft);
      color: var(--accent-ink);
    }

    .badge.warn {
      background: var(--warn-soft);
      color: var(--warn);
    }

    .badge.danger {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .chev {
      transition: transform .15s;
      color: var(--ink-faint);
    }

    .chev.open {
      transform: rotate(90deg);
    }

    .detail {
      padding: 0 16px 20px 50px;
      display: none;
    }

    .detail.open {
      display: block;
    }

    .detail h4 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--ink-faint);
      margin: 14px 0 8px;
    }

    table.items {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    table.items th {
      text-align: left;
      font-weight: 500;
      color: var(--ink-muted);
      font-size: 11.5px;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
    }

    table.items td {
      padding: 7px 8px;
      border-bottom: 1px solid var(--border);
    }

    table.items tr:last-child td {
      border-bottom: none;
    }

    .mismatch {
      color: var(--danger);
      font-weight: 600;
    }

    .empty {
      padding: 60px 20px;
      text-align: center;
      color: var(--ink-muted);
    }

    .empty .big {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      color: var(--ink);
      margin-bottom: 6px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div style="display:flex; align-items:center; gap:12px;">
        <img src="logo.png" alt="Satija Paper logo" style="height:48px; width:48px; object-fit:contain;">
        <div>
          <h1>Purchase order tracker</h1>
          <div class="sub" style="margin-top:2px;">Build: 2026-09-08-v6</div>
        </div>
      </div>
      <div style="display:flex; gap:8px; align-items:center;">
        <span class="ts" id="syncStatus" style="color:var(--ink-faint); font-size:11px;"></span>
        <button class="btn ghost small" onclick="resyncSeed()" title="Force a sync right now">&#8635; Resync from Purchase Form</button>
        <button class="btn ghost small" onclick="dedupeOrders()" title="Remove duplicate PO rows, keeping the most complete version">Clean up duplicates</button>
        <button class="btn ghost small" onclick="backfillFields()" title="Fill in missing GSTIN, vehicle, invoice, and doc-link details from Purchase Form">Backfill full details</button>
        <a class="btn ghost" href="https://script.google.com/a/macros/satijapaper.com/s/AKfycbxQNUAtVUGNGBNQBH6sQy_67tmCyiruYf9-quHGxNQKKTkzs9ZeBIIQvV7DEOBCN6m9/exec" target="_blank" style="text-decoration:none; display:inline-block;">Fill Purchase Form &#8599;</a>
      </div>
    </header>

    <div id="loginBanner" style="display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap; padding:12px 14px; border:1px solid var(--border); border-radius:10px; background:var(--surface);">
      <div id="signedOutView" style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
        <span class="sub" style="margin:0; font-weight:600;">Sign in with your Google account:</span>
        <div id="gSignInButton"></div>
      </div>
      <div id="signedInView" style="display:none; align-items:center; gap:10px; flex-wrap:wrap;">
        <span class="sub" style="margin:0;">Signed in as <b id="signedInEmail" class="mono"></b></span>
        <span id="adminSwitcher" style="display:none; gap:8px; flex-wrap:wrap;">
          <button class="btn small" id="btn-all" onclick="setCurrentUser('all')">Admin (view all)</button>
          <button class="btn ghost small" id="btn-sandeep" onclick="setCurrentUser('satijapaper@gmail.com')">Sandeep</button>
        </span>
        <button class="btn ghost small" onclick="signOutUser()">Sign out</button>
      </div>
    </div>

    <div id="adminControls" style="display:none; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap;">
      <input type="text" id="searchBox" placeholder="Search by PO number or mill..." oninput="setSearchQuery(this.value)" style="flex:1; min-width:200px; padding:9px 12px; border:1px solid var(--border-strong); border-radius:7px; font-family:inherit; font-size:13px;">
      <button class="btn small" id="btn-tab-pending" onclick="setAdminTab('pending')">Pending</button>
      <button class="btn ghost small" id="btn-tab-completed" onclick="setAdminTab('completed')">Completed</button>
    </div>

    <div class="stats" id="stats"></div>
    <div class="panel" id="panel"></div>
  </div>

  <script>
    const STEPS = [
      { key: 'PO1', label: 'Order placed', hours: 0, doerName: 'Mr. Sandeep Dhawan', doerEmails: ['satijapaper@gmail.com'], docs: [] },
      { key: 'PO2', label: 'Mill confirms', hours: 24, doerName: 'Mr. Sandeep Dhawan', doerEmails: ['satijapaper@gmail.com'], docs: ['Confirmation PDF'] },
      { key: 'PO3', label: 'Dispatch + invoice', hours: 48, doerName: 'Mr. Sandeep Dhawan', doerEmails: ['satijapaper@gmail.com'], docs: ['Packing List', 'Invoice PDF'] },
      { key: 'PO4', label: 'Driver follow-up', hours: 72, doerName: 'Mr. Sandeep Dhawan', doerEmails: ['satijapaper@gmail.com'], docs: [] },
      { key: 'PO5', label: 'Warehouse delivery', hours: 96, doerName: 'Mr. Sandeep Dhawan', doerEmails: ['satijapaper@gmail.com'], docs: ['Godown Slip', 'GR Signed Copy'] },
      { key: 'PO6', label: 'Transporter + GR', hours: 120, doerName: 'Mr. Sandeep Dhawan', doerEmails: ['satijapaper@gmail.com'], docs: ['E-Way Bill', 'GR Copy'] },
    ];
    const MANDATORY_DOCS = { PO3: ['Invoice PDF'] };
    let currentUser = 'all';
    let signedIn = false;

    const GOOGLE_CLIENT_ID = '347959572660-jl2k07qdhvqraj900jgfrbp9ljsddh62.apps.googleusercontent.com';
    const ADMIN_EMAILS = [
      'mis@satijapaper.com',
      'mukesh.shukla@satijapaper.com',
      'admin@satijapaper.com'
    ];
    const STAFF_EMAILS = {
      'satijapaper@gmail.com': 'satijapaper@gmail.com'
    };

    function initGoogleSignIn() {
      if (!GOOGLE_CLIENT_ID || !window.google || !window.google.accounts || !window.google.accounts.id) {
        return;
      }
      try {
        google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onGoogleSignIn });
        google.accounts.id.renderButton(document.getElementById('gSignInButton'), { theme: 'outline', size: 'medium' });
      } catch (e) {
        console.error('Google Sign-In init error:', e);
      }
    }

    function decodeJwt(token) {
      try {
        const payload = token.split('.')[1];
        return JSON.parse(decodeURIComponent(atob(payload.replace(/-/g, '+').replace(/_/g, '/')).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
      } catch (e) {
        return {};
      }
    }

    function applyUserSession(email) {
      if (!email) return;
      email = email.toLowerCase().trim();
      signedIn = true;
      const signedOutEl = document.getElementById('signedOutView');
      const signedInEl = document.getElementById('signedInView');
      const emailEl = document.getElementById('signedInEmail');
      if (signedOutEl) signedOutEl.style.display = 'none';
      if (signedInEl) signedInEl.style.display = 'flex';
      if (emailEl) emailEl.textContent = email;

      const isAdmin = ADMIN_EMAILS.includes(email) || email === 'mis@satijapaper.com';
      const isStaff = STAFF_EMAILS[email] || email === 'satijapaper@gmail.com';

      const switcherEl = document.getElementById('adminSwitcher');
      const controlsEl = document.getElementById('adminControls');

      if (isAdmin) {
        if (switcherEl) switcherEl.style.display = 'flex';
        if (controlsEl) controlsEl.style.display = 'flex';
        setCurrentUser('all');
      } else if (isStaff) {
        if (switcherEl) switcherEl.style.display = 'none';
        if (controlsEl) controlsEl.style.display = 'none';
        setCurrentUser('satijapaper@gmail.com');
      } else {
        if (switcherEl) switcherEl.style.display = 'none';
        if (controlsEl) controlsEl.style.display = 'none';
        document.getElementById('panel').innerHTML = '<div class="empty"><div class="big">No access</div>This email is not registered in this system.</div>';
        document.getElementById('stats').innerHTML = '';
      }
    }

    async function onGoogleSignIn(response) {
      const payload = decodeJwt(response.credential);
      const email = payload.email;
      if (!email) return;
      try {
        localStorage.setItem('purchaseFmsUser', JSON.stringify({ email }));
      } catch (e) { }
      applyUserSession(email);
    }

    function signOutUser() {
      currentUser = 'all';
      signedIn = false;
      try {
        localStorage.removeItem('purchaseFmsUser');
      } catch (e) { }
      document.getElementById('signedInView').style.display = 'none';
      document.getElementById('signedOutView').style.display = 'flex';
      const switcherEl = document.getElementById('adminSwitcher');
      const controlsEl = document.getElementById('adminControls');
      if (switcherEl) switcherEl.style.display = 'none';
      if (controlsEl) controlsEl.style.display = 'none';
      document.getElementById('stats').innerHTML = '';
      document.getElementById('panel').innerHTML = '<div class="empty"><div class="big">Please sign in first</div>Your data will appear after signing in with the Google button above.</div>';
      if (window.google && window.google.accounts && window.google.accounts.id) google.accounts.id.disableAutoSelect();
    }

    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxERIcFjijQaky9Ra-P14IoBjF6qEiCzjFdnB6RDg1l37WRV1Pl-QSVHKecR3I3np7a/exec';
  </script>
</body>

</html>
