<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Purchase order tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#F4F5F1; --surface:#FFFFFF; --border:#E1E3DC; --border-strong:#CBCFC5;
    --ink:#1C2119; --ink-muted:#5C6457; --ink-faint:#8A9080;
    --accent:#0F6E56; --accent-soft:#E1F5EE; --accent-ink:#085041;
    --warn:#9A5B0C; --warn-soft:#FAEEDA; --danger:#A32D2D; --danger-soft:#FCEBEB;
    --radius:10px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Inter',sans-serif; font-size:14px; line-height:1.55;
    padding:32px 24px 80px; min-height:100vh;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  .wrap{max-width:1080px; margin:0 auto;}

  header{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:28px; gap:16px; flex-wrap:wrap;}
  h1{font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:600; letter-spacing:-0.01em;}
  .sub{color:var(--ink-muted); font-size:13px; margin-top:4px;}
  .btn{
    background:var(--accent); color:#fff; border:none; border-radius:var(--radius);
    padding:11px 18px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit;
    transition:opacity .15s;
  }
  .btn:hover{opacity:.88;}
  .btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--border-strong);}
  .btn.small{padding:6px 12px; font-size:12.5px; border-radius:7px;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}

  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:28px;}
  .stat{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px;}
  .stat .num{font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:600;}
  .stat .lbl{font-size:12px; color:var(--ink-muted); margin-top:2px;}
  .stat.warn .num{color:var(--warn);}
  .stat.danger .num{color:var(--danger);}

  .panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
  .row-head{display:grid; grid-template-columns:34px 1.4fr 1.2fr 1fr 1.6fr 1fr 32px; gap:8px; padding:11px 16px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); border-bottom:1px solid var(--border);}
  .order-row{border-bottom:1px solid var(--border);}
  .order-row:last-child{border-bottom:none;}
  .order-summary{display:grid; grid-template-columns:34px 1.4fr 1.2fr 1fr 1.6fr 1fr 32px; gap:8px; padding:14px 16px; align-items:center; cursor:pointer;}
  .order-summary:hover{background:#FAFAF8;}
  .stamp{display:flex; gap:3px;}
  .tick{width:14px; height:14px; border-radius:3px; border:1px solid var(--border-strong); flex-shrink:0;}
  .tick.done{background:var(--accent); border-color:var(--accent);}
  .tick.overdue{background:var(--danger); border-color:var(--danger);}
  .pid{font-weight:600;}
  .badge{display:inline-block; font-size:11px; font-weight:600; padding:3px 8px; border-radius:5px;}
  .badge.ok{background:var(--accent-soft); color:var(--accent-ink);}
  .badge.warn{background:var(--warn-soft); color:var(--warn);}
  .badge.danger{background:var(--danger-soft); color:var(--danger);}
  .chev{transition:transform .15s; color:var(--ink-faint);}
  .chev.open{transform:rotate(90deg);}

  .detail{padding:0 16px 20px 50px; display:none;}
  .detail.open{display:block;}
  .detail h4{font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); margin:14px 0 8px;}
  table.items{width:100%; border-collapse:collapse; font-size:13px;}
  table.items th{text-align:left; font-weight:500; color:var(--ink-muted); font-size:11.5px; padding:6px 8px; border-bottom:1px solid var(--border);}
  table.items td{padding:7px 8px; border-bottom:1px solid var(--border);}
  table.items tr:last-child td{border-bottom:none;}
  .mismatch{color:var(--danger); font-weight:600;}
  .steps{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  .step-card{border:1px solid var(--border); border-radius:8px; padding:10px 12px; min-width:150px; flex:1;}
  .step-card.done{border-color:var(--accent); background:var(--accent-soft);}
  .step-card.current{border-color:var(--warn);}
  .step-card .name{font-weight:600; font-size:12.5px;}
  .step-card .time{font-size:11px; color:var(--ink-muted); margin-top:3px;}
  .step-card .time.late{color:var(--danger);}

  .inv-row{display:flex; align-items:center; gap:10px; padding:6px 0; font-size:13px;}
  .inv-row input{width:90px; padding:5px 7px; border:1px solid var(--border-strong); border-radius:6px; font-family:'JetBrains Mono',monospace; font-size:12.5px;}
  .doc-row{display:flex; align-items:center; gap:10px; padding:5px 0; font-size:12.5px;}
  .doc-row span{width:110px; flex-shrink:0; color:var(--ink-muted);}
  .doc-row input{flex:1; padding:6px 8px; border:1px solid var(--border-strong); border-radius:6px; font-family:'JetBrains Mono',monospace; font-size:12px;}
  .doc-chip{display:inline-flex; align-items:center; gap:4px; background:var(--accent-soft); color:var(--accent-ink); font-size:11px; font-weight:600; padding:3px 8px; border-radius:5px; margin:2px 4px 2px 0; text-decoration:none;}
  .task-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px 20px; margin-bottom:14px;}
  .task-card.overdue{border-color:var(--danger);}
  .task-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; flex-wrap:wrap; gap:8px;}
  .task-pid{font-family:'JetBrains Mono',monospace; font-weight:600; font-size:15px;}
  .task-sub{color:var(--ink-muted); font-size:13px; margin-bottom:14px;}
  .task-items{font-size:12.5px; color:var(--ink-muted); margin-bottom:10px; line-height:1.6;}

  .empty{padding:60px 20px; text-align:center; color:var(--ink-muted);}
  .empty .big{font-family:'Space Grotesk',sans-serif; font-size:18px; color:var(--ink); margin-bottom:6px;}

  .modal-bg{display:none; position:static; min-height:0;}
  .modal-bg.open{display:flex; align-items:flex-start; justify-content:center; min-height:100vh; background:rgba(20,22,18,.4); padding:40px 16px;}
  .modal{background:var(--surface); border-radius:14px; width:100%; max-width:560px; padding:24px; max-height:85vh; overflow-y:auto;}
  .modal h3{font-family:'Space Grotesk',sans-serif; font-size:18px; margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--ink-muted); margin-bottom:5px; font-weight:500;}
  .field input, .field select{width:100%; padding:9px 10px; border:1px solid var(--border-strong); border-radius:7px; font-family:inherit; font-size:13.5px;}
  .item-grid{display:grid; grid-template-columns:2fr 1fr 1fr 32px; gap:8px; margin-bottom:8px; align-items:center;}
  .item-grid input{padding:8px; border:1px solid var(--border-strong); border-radius:6px; font-size:12.5px;}
  .rm{background:none; border:none; color:var(--danger); font-size:16px; cursor:pointer;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}
</style>
</head>

  <header>
    <div>

</div>

function initGoogleSignIn(){

}

function decodeJwt(token){
  const payload = token.split('.')[1];
  return JSON.parse(decodeURIComponent(atob(payload.replace(/-/g,'+').replace(/_/g,'/')).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('')));
}

async function onGoogleSignIn(response){
  const payload = decodeJwt(response.credential);
  const email = payload.email;
  signedIn = true;
  document.getElementById('signedOutView').style.display = 'none';
  document.getElementById('signedInView').style.display = 'flex';
  document.getElementById('signedInEmail').textContent = email;

  if(ADMIN_EMAILS.includes(email)){
    document.getElementById('adminSwitcher').style.display = 'flex';
    await setCurrentUser('all');
  } else if(STAFF_EMAILS[email]){
    document.getElementById('adminSwitcher').style.display = 'none';
    await setCurrentUser(STAFF_EMAILS[email]);
  } else {
    document.getElementById('adminSwitcher').style.display = 'none';
    document.getElementById('panel').innerHTML = '<div class="empty"><div class="big">No access</div>This email is not registered in this system.</div>';

}

const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxFiS1W9E5lfT_mFeMUK-AV7INhKI8ugxYQ72uhOYEZLqtfxDdyoUPR5M0wdxc5c_HcmA/exec';

async function apiCall(payload){
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  });
  return res.json();
}

// Storage abstraction: real backend if configured, otherwise Claude test-storage.
async function backendGetOrders(){
  if(APPS_SCRIPT_URL){
    const data = await apiCall({action:'getOrders'});
    return data.orders || [];
  }
  const list = await window.storage.list('po:', false);
  if(!list || !list.keys || list.keys.length === 0) return null;
  const results = await Promise.all(list.keys.map(async k => {
    try{ const r = await window.storage.get(k, false); return r ? JSON.parse(r.value) : null; }
    catch(e){ return null; }
  }));
  return results.filter(Boolean);
}

async function backendSaveOrder(order){
  if(APPS_SCRIPT_URL){
    return apiCall({action:'saveOrder', order});
  }
  return window.storage.set('po:' + order.id, JSON.stringify(order), false);
}

async function backendUploadDoc(orderId, stepKey, docLabel, fileName, mimeType, base64){
  if(APPS_SCRIPT_URL){
    return apiCall({action:'uploadDoc', orderId, stepKey, docLabel, fileName, mimeType, base64});
  }
  const key = `doc:${orderId}:${stepKey}:${docLabel}`;
  await window.storage.set(key, base64, false);
  return { url: null, storedLocally: true };
}

function buildStepsForOrder(o){
  const steps = {};
  STEPS.forEach((s,i) => {
    steps[s.key] = {
      status: i === 0 ? 'done' : 'pending',
      planned: o.createdAt + s.hours*3600*1000,
      actual: i === 0 ? o.createdAt : null
    };
  });
  return steps;
}

async function loadOrders(){
  try{
    const cu = await window.storage.get('currentUser', false);
    if(cu && cu.value) currentUser = cu.value;
  }catch(e){}
  updateLoginButtons();
  try{
    const existing = await backendGetOrders();
    if(!existing || existing.length === 0){
      await seedFromPurchaseForm();
      return;
    }
    orders = existing.sort((a,b)=> b.createdAt - a.createdAt);
  }catch(e){
    orders = [];
  }
  render();
}

async function seedFromPurchaseForm(){
  const seeded = SEED_DATA.map(o => ({
    id: o.id, mill: o.mill, poDate: o.poDate, items: o.items,
    createdAt: o.createdAt, steps: o.steps || buildStepsForOrder(o),
    _legacySharedInvoiceQty: o._legacySharedInvoiceQty
  }));
  for(const o of seeded){ await saveOrder(o); }
  orders = seeded.sort((a,b)=> b.createdAt - a.createdAt);
  render();
}

async function resyncSeed(){
  if(APPS_SCRIPT_URL){
    const result = await apiCall({action:'resync'});
    alert(`${result.added || 0} new orders found from the Purchase Form (checked ${result.totalInForm || 0} total).`);
    await loadOrders();
    return;
  }
  if(!confirm('This will reset all existing tracking (step status, invoice qty) and reload from Purchase Form 26-27. Continue?')) return;
  const list = await window.storage.list('po:', false);
  if(list && list.keys){
    for(const k of list.keys){ try{ await window.storage.delete(k, false); }catch(e){} }
  }
  await seedFromPurchaseForm();
}

async function saveOrder(o){
  try{
    await backendSaveOrder(o);
  }catch(e){
    console.error('save failed', e);
  }
}

function fmtMoney(n){
  return '\u20b9' + Math.round(n).toLocaleString('en-IN');
}
function fmtDate(ts){
  if(!ts) return '\u2014';
  const d = new Date(ts);
  return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}) + ' ' + d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
}
function orderValue(o){
  return o.items.reduce((s,i)=> s + i.orderQty * i.rate, 0);
}
function currentStepIndex(o){
  for(let i=0;i<STEPS.length;i++){ if(o.steps[STEPS[i].key].status !== 'done') return i; }
  return STEPS.length;
}
function isStepOverdue(o, idx){
  const st = o.steps[STEPS[idx].key];
  if(st.status === 'done') return false;
  return Date.now() > st.planned;
}
function orderHasMismatch(o){
  return o.items.some(i => i.invoiceQty !== null && i.invoiceQty !== undefined && i.invoiceQty !== i.orderQty);
}

async function setCurrentUser(v){
  currentUser = v;
  try{ await window.storage.set('currentUser', v, false); }catch(e){}
  updateLoginButtons();
  render();
}

function updateLoginButtons(){
  ['all','satijapaper@gmail.com','poojasatijapaper@gmail.com'].forEach(v => {
    const id = v === 'all' ? 'btn-all' : (v === 'satijapaper@gmail.com' ? 'btn-sandeep' : 'btn-pooja');
    const el = document.getElementById(id);
    if(el) el.className = (v === currentUser) ? 'btn small' : 'btn ghost small';
  });
}

function visibleOrders(){
  const notDone = orders.filter(o => currentStepIndex(o) < STEPS.length);
  if(currentUser === 'all') return notDone;
  return notDone.filter(o => STEPS[currentStepIndex(o)].doerEmail === currentUser);
}

function render(){
  if(!signedIn) return;
  renderStats();
  renderPanel();
}

function renderStats(){
  const vis = visibleOrders();
  const open = vis.length;
  const overdue = vis.filter(o => isStepOverdue(o, currentStepIndex(o))).length;
  const mismatches = vis.filter(orderHasMismatch).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="num">${open}</div><div class="lbl">Pending orders</div></div>
    <div class="stat ${overdue>0?'danger':''}"><div class="num">${overdue}</div><div class="lbl">Overdue right now</div></div>
    <div class="stat ${mismatches>0?'warn':''}"><div class="num">${mismatches}</div><div class="lbl">Qty mismatches</div></div>
  `;
}

function renderTaskCard(o){
  const idx = currentStepIndex(o);
  const s = STEPS[idx];
  const st = o.steps[s.key];
  const overdue = isStepOverdue(o, idx);
  const itemsLine = o.items.map(it => `${it.product} (${it.orderQty} ${it.unit})`).join(', ');

  const docInputs = s.docs.map(d => {
    const safe = d.replace(/\s+/g,'_');
    return `<div class="doc-row">
      <span>${d}</span>
      <input type="file" id="doc-${o.id}-${s.key}-${safe}" onchange="handleFileSelect(event,'${o.id}','${s.key}','${d}')">
      <span class="ts" id="docstat-${o.id}-${s.key}-${safe}" style="min-width:80px;"></span>
    </div>`;
  }).join('');
  const invInputs = s.key === 'PO3' ? o.items.map(it => `
      <div class="inv-row">
        <span style="flex:1;">${it.product}</span>
        <input type="number" id="inv-${o.id}-${it.id}" value="${it.orderQty}" step="0.01">
      </div>`).join('') : '';

  return `<div class="task-card ${overdue?'overdue':''}">
    <div class="task-head">
      <span class="task-pid">${o.id}</span>
      <span class="badge ${overdue?'danger':'warn'}">${s.key} \u00b7 ${s.label}${overdue?' \u00b7 overdue':''}</span>
    </div>
    <div class="task-sub">${o.mill} &middot; Planned: ${fmtDate(st.planned)}</div>
    <div class="task-items">${itemsLine}</div>
    ${invInputs}${docInputs}
    <button class="btn small" style="margin-top:8px;" onclick="completeStep('${o.id}','${s.key}')">Mark done</button>
  </div>`;
}

function renderPanel(){
  const panel = document.getElementById('panel');
  const vis = visibleOrders();
  if(orders.length === 0){
    panel.innerHTML = `<div class="empty"><div class="big">No purchase orders yet</div>Naya order banane ke liye Purchase Form use kariye.<br><br><a class="btn" href="https://script.google.com/a/macros/satijapaper.com/s/AKfycbxQNUAtVUGNGBNQBH6sQy_67tmCyiruYf9-quHGxNQKKTkzs9ZeBIIQvV7DEOBCN6m9/exec" target="_blank" style="text-decoration:none;">Fill Purchase Form &#8599;</a></div>`;
    return;
  }
  if(vis.length === 0){
    panel.innerHTML = `<div class="empty"><div class="big">No pending work</div>All orders are complete or belong to someone else.</div>`;
    return;
  }
  if(currentUser !== 'all'){
    const myStepKeys = STEPS.filter(s => s.doerEmail === currentUser).map(s => s.key);
    let html = '';
    let anyWork = false;
    myStepKeys.forEach(stepKey => {
      const stepDef = STEPS.find(s => s.key === stepKey);
      const forStep = vis.filter(o => STEPS[currentStepIndex(o)].key === stepKey);
      if(forStep.length === 0) return;
      anyWork = true;
      html += `<div style="margin:22px 0 10px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:600;">${stepKey} \u00b7 ${stepDef.label} <span class="mono" style="text-transform:none; letter-spacing:0;">(${forStep.length})</span></div>`;
      html += forStep.map(o => renderTaskCard(o)).join('');
    });
    if(!anyWork){
      html = `<div class="empty"><div class="big">No pending work</div>All steps are complete.</div>`;
    }
    panel.innerHTML = html;
    return;
  }
  let html = `<div class="row-head"><div></div><div>PO</div><div>Mill</div><div>Value</div><div>Progress</div><div>Current step</div><div></div></div>`;
  vis.forEach(o => {
    const idx = currentStepIndex(o);
    const done = idx >= STEPS.length;
    const overdue = !done && isStepOverdue(o, idx);
    const mismatch = orderHasMismatch(o);
    const isOpen = !!expanded[o.id];
    const stamps = STEPS.map((s,i) => {
      let cls = 'tick';
      if(o.steps[s.key].status === 'done') cls += ' done';
      else if(i === idx && overdue) cls += ' overdue';
      return `<div class="${cls}" title="${s.label}"></div>`;
    }).join('');
    let statusBadge;
    if(done) statusBadge = `<span class="badge ok">Completed</span>`;
    else if(overdue) statusBadge = `<span class="badge danger">Overdue \u00b7 ${STEPS[idx].label}</span>`;
    else statusBadge = `<span class="badge warn">${STEPS[idx].label}</span>`;

    html += `
    <div class="order-row">
      <div class="order-summary" onclick="toggleExpand('${o.id}')">
        <div class="chev ${isOpen?'open':''}">&#9656;</div>
        <div><div class="pid mono">${o.id}</div>${mismatch?'<div class="badge danger" style="margin-top:4px;">Qty mismatch</div>':''}</div>
        <div>${o.mill}</div>
        <div class="mono">${fmtMoney(orderValue(o))}</div>
        <div class="stamp">${stamps}</div>
        <div>${statusBadge}</div>
        <div></div>
      </div>
      <div class="detail ${isOpen?'open':''}" id="detail-${o.id}">
        ${renderDetail(o)}
      </div>
    </div>`;
  });
  panel.innerHTML = html;
}

function renderDetail(o){
  const idx = currentStepIndex(o);
  let legacyNote = '';
  if(o._legacySharedInvoiceQty){
    legacyNote = `<div class="badge danger" style="margin-bottom:8px; display:block; width:fit-content;">The old FMS had one shared Invoice Qty: ${o._legacySharedInvoiceQty} Kg &mdash; how it split across ${o.items.length} items is unknown, so it is left blank here. Confirm item-wise below.</div>`;
  }
  let itemsHtml = `<table class="items"><tr><th>Product</th><th>Order qty</th><th>Rate</th><th>Amount</th><th>Invoice qty</th></tr>`;
  o.items.forEach(i => {
    const hasInv = i.invoiceQty !== null && i.invoiceQty !== undefined;
    const mismatch = hasInv && i.invoiceQty !== i.orderQty;
    itemsHtml += `<tr>
      <td>${i.product}</td>
      <td class="mono">${i.orderQty} ${i.unit}</td>
      <td class="mono">${i.rate}</td>
      <td class="mono">${fmtMoney(i.orderQty*i.rate)}</td>
      <td class="mono ${mismatch?'mismatch':''}">${hasInv ? i.invoiceQty + ' ' + i.unit + (mismatch ? ' (diff ' + (i.invoiceQty-i.orderQty) + ')' : '') : '\u2014'}</td>
    </tr>`;
  });
  itemsHtml += `</table>`;

  let stepsHtml = `<div class="steps">`;
  STEPS.forEach((s,i) => {
    const st = o.steps[s.key];
    const overdue = st.status !== 'done' && Date.now() > st.planned;
    let cls = 'step-card';
    if(st.status === 'done') cls += ' done';
    else if(i === idx) cls += ' current';
    const plannedLine = `<div class="time">Planned: ${fmtDate(st.planned)}</div>`;
    const doneLine = st.status === 'done'
      ? `<div class="time">Done: ${fmtDate(st.actual)}</div>`
      : `<div class="time ${overdue?'late':''}">Done: &mdash;${overdue?' (overdue)':''}</div>`;
    let actionHtml = '';
    if(i === idx && st.status !== 'done'){
      const docInputs = s.docs.map(d => {
        const safe = d.replace(/\s+/g,'_');
        return `<div class="doc-row">
          <span>${d}</span>
          <input type="file" id="doc-${o.id}-${s.key}-${safe}" onchange="handleFileSelect(event,'${o.id}','${s.key}','${d}')">
          <span class="ts" id="docstat-${o.id}-${s.key}-${safe}" style="min-width:80px;"></span>
        </div>`;
      }).join('');
      const invInputs = s.key === 'PO3' ? o.items.map(it => `
          <div class="inv-row">
            <span style="flex:1;">${it.product}</span>
            <input type="number" id="inv-${o.id}-${it.id}" value="${it.orderQty}" step="0.01">
          </div>`).join('') : '';
      actionHtml = `<div style="margin-top:8px;">${invInputs}${docInputs}
          <button class="btn small" style="margin-top:6px;" onclick="completeStep('${o.id}','${s.key}')">Mark done</button>
        </div>`;
    } else if(st.status === 'done' && s.docs.length){
      const chips = s.docs.map(d => {
        const has = st.docs && st.docs[d];
        return has ? `<a href="#" onclick="viewDoc('${o.id}','${s.key}','${d}');return false;" class="doc-chip">${d} &#8599;</a>` : `<span class="doc-chip" style="opacity:.5;">${d} missing</span>`;
      }).join('');
      actionHtml = `<div style="margin-top:6px;">${chips}</div>`;
    }
    stepsHtml += `<div class="${cls}"><div class="name">${s.key} \u00b7 ${s.label}</div><div class="ts" style="font-size:11px; color:var(--ink-faint); margin-top:2px;">${s.doerName}</div>${plannedLine}${doneLine}${actionHtml}</div>`;
  });
  stepsHtml += `</div>`;

  return `${legacyNote}<h4>Items</h4>${itemsHtml}<h4>Steps</h4>${stepsHtml}`;
}

function handleFileSelect(evt, orderId, stepKey, docLabel){
  const file = evt.target.files[0];
  const safe = docLabel.replace(/\s+/g,'_');
  const statusEl = document.getElementById(`docstat-${orderId}-${stepKey}-${safe}`);
  if(!file) return;
  if(file.size > 4 * 1024 * 1024){
    if(statusEl) statusEl.textContent = 'File too large (max 4MB)';
    evt.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    pendingDocs[orderId] = pendingDocs[orderId] || {};
    pendingDocs[orderId][stepKey] = pendingDocs[orderId][stepKey] || {};
    pendingDocs[orderId][stepKey][docLabel] = {dataUrl: reader.result, name: file.name};
    if(statusEl) statusEl.textContent = `\u2713 ${file.name}`;
  };
  reader.onerror = () => { if(statusEl) statusEl.textContent = 'Upload failed'; };
  reader.readAsDataURL(file);
}

async function viewDoc(orderId, stepKey, docLabel){
  const o = orders.find(x => x.id === orderId);
  const docInfo = o && o.steps[stepKey].docs && o.steps[stepKey].docs[docLabel];
  if(docInfo && docInfo.url){
    window.open(docInfo.url, '_blank');
    return;
  }
  try{
    const key = `doc:${orderId}:${stepKey}:${docLabel}`;
    const r = await window.storage.get(key, false);
    if(!r){ alert('Document not found'); return; }
    const res = await fetch(r.value);
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    window.open(blobUrl, '_blank');
  }catch(e){
    alert('Could not load the document');
  }
}

function toggleExpand(id){
  expanded[id] = !expanded[id];
  render();
}

async function completeStep(orderId, stepKey){
  const o = orders.find(x => x.id === orderId);
  if(!o) return;
  const stepDef = STEPS.find(s => s.key === stepKey);

  if(stepKey === 'PO3'){
    o.items.forEach(it => {
      const el = document.getElementById(`inv-${orderId}-${it.id}`);
      if(el && el.value !== '') it.invoiceQty = parseFloat(el.value);
    });
  }

  const uploaded = (pendingDocs[orderId] && pendingDocs[orderId][stepKey]) || {};
  let missing = [];
  stepDef.docs.forEach(d => { if(!uploaded[d]) missing.push(d); });
  if(missing.length){
    if(!confirm(`${missing.join(', ')} not uploaded. Complete this step anyway without the document?`)) return;
  }

  const docsFlag = {};
  for(const d of Object.keys(uploaded)){
    try{
      const result = await backendUploadDoc(orderId, stepKey, d, uploaded[d].name, uploaded[d].dataUrl.split(';')[0].split(':')[1], uploaded[d].dataUrl);
      docsFlag[d] = { name: uploaded[d].name, url: result.url || null };
    }catch(e){
      console.error('doc save failed', e);
    }
  }

  o.steps[stepKey].status = 'done';
  o.steps[stepKey].actual = Date.now();
  if(Object.keys(docsFlag).length) o.steps[stepKey].docs = docsFlag;
  if(pendingDocs[orderId]) delete pendingDocs[orderId][stepKey];
  await saveOrder(o);
  render();
}



document.getElementById('panel').innerHTML = '<div class="empty"><div class="big">Please sign in first</div>Your data will appear after signing in with the Google button above.</div>';
window.addEventListener('load', initGoogleSignIn);
loadOrders();
</script>
