<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Purchase order tracker</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#F4F5F1; --surface:#FFFFFF; --border:#E1E3DC; --border-strong:#CBCFC5;
    --ink:#1C2119; --ink-muted:#5C6457; --ink-faint:#8A9080;
    --accent:#0F6E56; --accent-soft:#E1F5EE; --accent-ink:#085041;
    --warn:#9A5B0C; --warn-soft:#FAEEDA; --danger:#A32D2D; --danger-soft:#FCEBEB;
    --radius:10px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Inter',sans-serif; font-size:14px; line-height:1.55;
    padding:32px 24px 80px; min-height:100vh;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  .wrap{max-width:1080px; margin:0 auto;}

  header{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:28px; gap:16px; flex-wrap:wrap;}
  h1{font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:600; letter-spacing:-0.01em;}
  .sub{color:var(--ink-muted); font-size:13px; margin-top:4px;}
  .btn{
    background:var(--accent); color:#fff; border:none; border-radius:var(--radius);
    padding:11px 18px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit;
    transition:opacity .15s;
  }
  .btn:hover{opacity:.88;}
  .btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--border-strong);}
  .btn.small{padding:6px 12px; font-size:12.5px; border-radius:7px;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}

  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:28px;}
  .stat{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px;}
  .stat .num{font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:600;}
  .stat .lbl{font-size:12px; color:var(--ink-muted); margin-top:2px;}
  .stat.warn .num{color:var(--warn);}
  .stat.danger .num{color:var(--danger);}

  .panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
  .row-head{display:grid; grid-template-columns:34px 1.4fr 1.2fr 1fr 1.6fr 1fr 32px; gap:8px; padding:11px 16px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); border-bottom:1px solid var(--border);}
  .order-row{border-bottom:1px solid var(--border);}
  .order-row:last-child{border-bottom:none;}
  .order-summary{display:grid; grid-template-columns:34px 1.4fr 1.2fr 1fr 1.6fr 1fr 32px; gap:8px; padding:14px 16px; align-items:center; cursor:pointer;}
  .order-summary:hover{background:#FAFAF8;}
  .stamp{display:flex; gap:3px;}
  .tick{width:14px; height:14px; border-radius:3px; border:1px solid var(--border-strong); flex-shrink:0;}
  .tick.done{background:var(--accent); border-color:var(--accent);}
  .tick.overdue{background:var(--danger); border-color:var(--danger);}
  .pid{font-weight:600;}
  .badge{display:inline-block; font-size:11px; font-weight:600; padding:3px 8px; border-radius:5px;}
  .badge.ok{background:var(--accent-soft); color:var(--accent-ink);}
  .badge.warn{background:var(--warn-soft); color:var(--warn);}
  .badge.danger{background:var(--danger-soft); color:var(--danger);}
  .chev{transition:transform .15s; color:var(--ink-faint);}
  .chev.open{transform:rotate(90deg);}

  .detail{padding:0 16px 20px 50px; display:none;}
  .detail.open{display:block;}
  .detail h4{font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); margin:14px 0 8px;}
  table.items{width:100%; border-collapse:collapse; font-size:13px;}
  table.items th{text-align:left; font-weight:500; color:var(--ink-muted); font-size:11.5px; padding:6px 8px; border-bottom:1px solid var(--border);}
  table.items td{padding:7px 8px; border-bottom:1px solid var(--border);}
  table.items tr:last-child td{border-bottom:none;}
  .mismatch{color:var(--danger); font-weight:600;}
  .steps{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  .step-card{border:1px solid var(--border); border-radius:8px; padding:10px 12px; min-width:150px; max-width:100%; flex:1 1 150px; box-sizing:border-box; overflow:hidden;}
  .step-card.done{border-color:var(--accent); background:var(--accent-soft);}
  .step-card.current{border-color:var(--warn);}
  .step-card .name{font-weight:600; font-size:12.5px;}
  .step-card .time{font-size:11px; color:var(--ink-muted); margin-top:3px;}
  .step-card .time.late{color:var(--danger);}

  .inv-row{display:flex; align-items:flex-start; gap:10px; padding:6px 0; font-size:13px;}
  .inv-row input{width:90px; margin-top:1px; padding:5px 7px; border:1px solid var(--border-strong); border-radius:6px; font-family:'JetBrains Mono',monospace; font-size:12.5px;}
  .doc-row{display:flex; flex-direction:column; gap:4px; padding:6px 0; font-size:12.5px;}
  .doc-row span{color:var(--ink-muted);}
  .doc-row input{width:100%; max-width:100%; box-sizing:border-box; padding:8px 10px; border:1px solid var(--border-strong); border-radius:6px; font-size:12.5px; font-family:inherit;}
  .doc-row input[type="file"]{font-size:11px; overflow:hidden;}
  .delay-text{font-size:11px; font-weight:600; margin-top:3px;}
  .delay-text.ok{color:var(--accent-ink);}
  .delay-text.late{color:var(--danger);}
  .confirm-box{background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-top:10px;}
  .confirm-group{font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); font-weight:700; margin:12px 0 6px;}
  .confirm-group:first-child{margin-top:0;}
  .field-grid{display:grid; grid-template-columns:1fr 1fr; gap:4px 14px;}
  .field-grid .field{margin-bottom:8px;}
  .field-hint{display:block; font-size:10.5px; color:var(--ink-faint); font-weight:400; margin-top:3px;}
  @media (max-width:480px){ .field-grid{grid-template-columns:1fr;} }
  .doc-chip{display:inline-flex; align-items:center; gap:4px; background:var(--accent-soft); color:var(--accent-ink); font-size:11px; font-weight:600; padding:3px 8px; border-radius:5px; margin:2px 4px 2px 0; text-decoration:none;}
  .task-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px 20px; margin-bottom:14px; box-sizing:border-box; overflow:hidden;}
  .task-card.overdue{border-color:var(--danger);}
  .task-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; flex-wrap:wrap; gap:8px;}
  .task-pid{font-family:'JetBrains Mono',monospace; font-weight:600; font-size:15px;}
  .task-sub{color:var(--ink-muted); font-size:13px; margin-bottom:14px;}
  .task-items{font-size:12.5px; color:var(--ink-muted); margin-bottom:10px; line-height:1.6;}

  .empty{padding:60px 20px; text-align:center; color:var(--ink-muted);}
  .empty .big{font-family:'Space Grotesk',sans-serif; font-size:18px; color:var(--ink); margin-bottom:6px;}

  .modal-bg{display:none; position:static; min-height:0;}
  .modal-bg.open{display:flex; align-items:flex-start; justify-content:center; min-height:100vh; background:rgba(20,22,18,.4); padding:40px 16px;}
  .modal{background:var(--surface); border-radius:14px; width:100%; max-width:560px; padding:24px; max-height:85vh; overflow-y:auto;}
  .modal h3{font-family:'Space Grotesk',sans-serif; font-size:18px; margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--ink-muted); margin-bottom:5px; font-weight:500;}
  .field input, .field select{width:100%; padding:9px 10px; border:1px solid var(--border-strong); border-radius:7px; font-family:inherit; font-size:13.5px;}
  .item-grid{display:grid; grid-template-columns:2fr 1fr 1fr 32px; gap:8px; margin-bottom:8px; align-items:center;}
  .item-grid input{padding:8px; border:1px solid var(--border-strong); border-radius:6px; font-size:12.5px;}
  .rm{background:none; border:none; color:var(--danger); font-size:16px; cursor:pointer;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div style="display:flex; align-items:center; gap:12px;">
      <img src="logo.png" alt="Satija Paper logo" style="height:48px; width:48px; object-fit:contain;">
      <div>
        <h1>Purchase order tracker</h1>
        <div class="sub" style="margin-top:2px;">Build: 2026-07-26-v3</div>
      </div>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <span class="ts" id="syncStatus" style="color:var(--ink-faint); font-size:11px;"></span>
      <button class="btn ghost small" onclick="resyncSeed()" title="Force a sync right now">&#8635; Resync from Purchase Form</button>
      <button class="btn ghost small" onclick="dedupeOrders()" title="Remove duplicate PO rows, keeping the most complete version">Clean up duplicates</button>
      <button class="btn ghost small" onclick="backfillFields()" title="Fill in missing GSTIN, vehicle, invoice, and doc-link details from Purchase Form + old FMS">Backfill full details</button>
      <a class="btn ghost" href="https://script.google.com/a/macros/satijapaper.com/s/AKfycbxQNUAtVUGNGBNQBH6sQy_67tmCyiruYf9-quHGxNQKKTkzs9ZeBIIQvV7DEOBCN6m9/exec" target="_blank" style="text-decoration:none; display:inline-block;">Fill Purchase Form &#8599;</a>
    </div>
  </header>

  <div id="loginBanner" style="display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap; padding:12px 14px; border:1px solid var(--border); border-radius:10px; background:var(--surface);">
    <div id="signedOutView" style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
      <span class="sub" style="margin:0; font-weight:600;">Sign in with your Google account:</span>
      <div id="gSignInButton"></div>
    </div>
    <div id="signedInView" style="display:none; align-items:center; gap:10px; flex-wrap:wrap;">
      <span class="sub" style="margin:0;">Signed in as <b id="signedInEmail" class="mono"></b></span>
      <span id="adminSwitcher" style="display:none; gap:8px; flex-wrap:wrap;">
        <button class="btn small" id="btn-all" onclick="setCurrentUser('all')">Admin (view all)</button>
        <button class="btn ghost small" id="btn-sandeep" onclick="setCurrentUser('satijapaper@gmail.com')">Sandeep</button>

        <button class="btn ghost small" id="btn-pooja" onclick="setCurrentUser('poojasatijapaper@gmail.com')">Pooja</button>
      </span>
      <button class="btn ghost small" onclick="signOutUser()">Sign out</button>
    </div>
  </div>

  <div id="adminControls" style="display:none; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap;">
    <input type="text" id="searchBox" placeholder="Search by PO number or mill..." oninput="setSearchQuery(this.value)" style="flex:1; min-width:200px; padding:9px 12px; border:1px solid var(--border-strong); border-radius:7px; font-family:inherit; font-size:13px;">

</div>

function initGoogleSignIn(){
  if(!GOOGLE_CLIENT_ID || !window.google){
    document.getElementById('signedOutView').innerHTML = '<span class="ts" style="color:var(--danger);">Google Client ID is not configured yet (GOOGLE_CLIENT_ID is empty).</span>';
    return;
  }
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onGoogleSignIn });
  google.accounts.id.renderButton(document.getElementById('gSignInButton'), { theme:'outline', size:'medium' });
}

function decodeJwt(token){
  const payload = token.split('.')[1];
  return JSON.parse(decodeURIComponent(atob(payload.replace(/-/g,'+').replace(/_/g,'/')).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('')));
}

async function onGoogleSignIn(response){
  const payload = decodeJwt(response.credential);
  const email = payload.email;
  signedIn = true;
  document.getElementById('signedOutView').style.display = 'none';
  document.getElementById('signedInView').style.display = 'flex';
  document.getElementById('signedInEmail').textContent = email;

  if(ADMIN_EMAILS.includes(email)){
    document.getElementById('adminSwitcher').style.display = 'flex';
    await setCurrentUser('all');
  } else if(STAFF_EMAILS[email]){
    document.getElementById('adminSwitcher').style.display = 'none';
    await setCurrentUser(STAFF_EMAILS[email]);
  } else {
    document.getElementById('adminSwitcher').style.display = 'none';
    document.getElementById('panel').innerHTML = '<div class="empty"><div class="big">No access</div>This email is not registered in this system.</div>';
    document.getElementById('stats').innerHTML = '';
  }
}

function signOutUser(){
  currentUser = 'all';
  signedIn = false;
  document.getElementById('signedInView').style.display = 'none';
  document.getElementById('signedOutView').style.display = 'flex';
  document.getElementById('adminSwitcher').style.display = 'none';
  document.getElementById('stats').innerHTML = '';
  document.getElementById('panel').innerHTML = '<div class="empty"><div class="big">Please sign in first</div>Your data will appear after signing in with the Google button above.</div>';
  if(window.google) google.accounts.id.disableAutoSelect();
}

// ===== BACKEND CONFIG =====
// After deploying the Apps Script, paste its Web App URL here.
// Leave empty to run the dashboard in test-mode inside Claude (window.storage).
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxFiS1W9E5lfT_mFeMUK-AV7INhKI8ugxYQ72uhOYEZLqtfxDdyoUPR5M0wdxc5c_HcmA/exec';

async function apiCall(payload){
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  });
  return res.json();
}

// Storage abstraction: real backend if configured, otherwise Claude test-storage.
async function backendGetOrders(){
  if(APPS_SCRIPT_URL){
    const data = await apiCall({action:'getOrders'});
    return data.orders || [];
  }
  const list = await window.storage.list('po:', false);
  if(!list || !list.keys || list.keys.length === 0) return null;
  const results = await Promise.all(list.keys.map(async k => {
    try{ const r = await window.storage.get(k, false); return r ? JSON.parse(r.value) : null; }
    catch(e){ return null; }
  }));
  return results.filter(Boolean);
}

async function backendSaveOrder(order){
  if(APPS_SCRIPT_URL){
    return apiCall({action:'saveOrder', order});
  }
  return window.storage.set('po:' + order.id, JSON.stringify(order), false);
}

async function backendUploadDoc(orderId, stepKey, docLabel, fileName, mimeType, base64){
  if(APPS_SCRIPT_URL){
    return apiCall({action:'uploadDoc', orderId, stepKey, docLabel, fileName, mimeType, base64});
  }
  const key = `doc:${orderId}:${stepKey}:${docLabel}`;
  await window.storage.set(key, base64, false);
  return { url: null, storedLocally: true };
}

function buildStepsForOrder(o){
  const steps = {};
  STEPS.forEach((s,i) => {
    steps[s.key] = {
      status: i === 0 ? 'done' : 'pending',
      planned: o.createdAt + s.hours*3600*1000,
      actual: i === 0 ? o.createdAt : null
    };
  });
  return steps;
}

function poNumber(id){
  const m = String(id).match(/(\d+)\s*$/);
  return m ? parseInt(m[1], 10) : 0;
}

async function loadOrders(){
  try{
    const cu = await window.storage.get('currentUser', false);
    if(cu && cu.value) currentUser = cu.value;
  }catch(e){}
  updateLoginButtons();
  try{
    const existing = await backendGetOrders();
    if(!existing || existing.length === 0){
      await seedFromPurchaseForm();
      return;
    }
    orders = existing.sort((a,b)=> poNumber(b.id) - poNumber(a.id));
  }catch(e){
    orders = [];
  }
  render();
}

async function seedFromPurchaseForm(){
  const seeded = SEED_DATA.map(o => ({
    id: o.id, mill: o.mill, poDate: o.poDate, items: o.items,
    createdAt: o.createdAt, steps: o.steps || buildStepsForOrder(o),
    _legacySharedInvoiceQty: o._legacySharedInvoiceQty
  }));
  for(const o of seeded){ await saveOrder(o); }
  orders = seeded.sort((a,b)=> poNumber(b.id) - poNumber(a.id));
  render();
}

// Both the auto-refresh timer and the manual "Resync" button go through
// this. resync/seedHistory are additive-only on the backend (never
// overwrite existing progress), so it's safe to run silently in the
// background as often as every few minutes.
let syncInFlight = false;
async function runSync(showAlert){
  if(!APPS_SCRIPT_URL || syncInFlight) return;
  syncInFlight = true;
  const statusEl = document.getElementById('syncStatus');
  if(statusEl) statusEl.textContent = 'Syncing…';
  try{
    const result = await apiCall({action:'resync'});
    const fmsNote = result.oldFmsAvailable === false ? ' (old FMS not reachable, skipped)' : '';

    // Also make sure no historical orders (like old PO0001-0049) are missing -
    // done as one batch call on the backend, only ever adds, never overwrites.
    let historyAdded = 0;
    try{
      const historyResult = await apiCall({action:'seedHistory', historyOrders: SEED_DATA});
      historyAdded = historyResult.added || 0;
    }catch(e){
      console.error('seedHistory failed', e);
    }

    const summary = `${result.added || 0} new, ${result.statusUpdated || 0} updated from old FMS, ${historyAdded} historical added${fmsNote}`;
    const stamp = new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
    if(statusEl) statusEl.textContent = `Synced ${stamp} · ${summary}`;
    if(showAlert) alert(summary);
    await loadOrders();
  }catch(e){
    console.error('sync failed', e);
    if(statusEl) statusEl.textContent = 'Sync failed, will retry automatically';
  }finally{
    syncInFlight = false;
  }
}

async function resyncSeed(){
  if(APPS_SCRIPT_URL){
    await runSync(true);
    return;
  }
  if(!confirm('This will reset all existing tracking (step status, invoice qty) and reload from Purchase Form 26-27. Continue?')) return;
  const list = await window.storage.list('po:', false);
  if(list && list.keys){
    for(const k of list.keys){ try{ await window.storage.delete(k, false); }catch(e){} }
  }
  await seedFromPurchaseForm();
}

async function backfillFields(){
  if(!APPS_SCRIPT_URL){
    alert('This only works once the Apps Script backend is connected.');
    return;
  }
  if(!confirm('This will fill in missing GSTIN, vehicle, invoice, and doc-link details from Purchase Form + old FMS, without changing any existing data. Continue?')) return;
  const result = await apiCall({action:'backfill'});
  alert(`Backfill complete. ${result.updated || 0} orders checked and updated.`);
  await loadOrders();
}

async function dedupeOrders(){
  if(!APPS_SCRIPT_URL){
    alert('This only works once the Apps Script backend is connected.');
    return;
  }
  if(!confirm('This will remove duplicate PO rows, keeping the most complete version of each. Continue?')) return;
  const result = await apiCall({action:'dedupe'});
  alert(`Cleaned up. ${result.totalUnique || 0} unique orders remain.`);
  await loadOrders();
}

async function saveOrder(o){
  try{
    await backendSaveOrder(o);
  }catch(e){
    console.error('save failed', e);
  }
}

function fmtMoney(n){
  return '\u20b9' + Math.round(n).toLocaleString('en-IN');
}
function fmtDate(ts){
  if(!ts) return '\u2014';
  const d = new Date(ts);
  return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}) + ' ' + d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
}
function fmtDuration(ms){
  const mins = Math.round(Math.abs(ms) / 60000);
  const h = Math.floor(mins / 60), m = mins % 60;
  if(h === 0) return m + 'm';
  return h + 'h ' + m + 'm';
}
function delayText(st){
  if(st.status === 'done' && st.actual && st.planned){
    const diff = st.actual - st.planned;
    return diff <= 0
      ? `<span class="delay-text ok">On time</span>`
      : `<span class="delay-text late">Delayed by ${fmtDuration(diff)}</span>`;
  }
  if(st.status !== 'done' && st.planned && Date.now() > st.planned){
    return `<span class="delay-text late">Overdue by ${fmtDuration(Date.now() - st.planned)}</span>`;
  }
  return '';
}
function orderValue(o){
  return o.items.reduce((s,i)=> s + i.orderQty * i.rate, 0);
}
function currentStepIndex(o){
  for(let i=0;i<STEPS.length;i++){ if(o.steps[STEPS[i].key].status !== 'done') return i; }
  return STEPS.length;
}
function isStepOverdue(o, idx){
  if(idx >= STEPS.length) return false;
  const st = o.steps[STEPS[idx].key];
  if(st.status === 'done') return false;
  return Date.now() > st.planned;
}
function orderHasMismatch(o){
  return o.items.some(i => i.invoiceQty !== null && i.invoiceQty !== undefined && i.invoiceQty !== i.orderQty);
}

async function setCurrentUser(v){
  currentUser = v;
  try{ await window.storage.set('currentUser', v, false); }catch(e){}
  updateLoginButtons();
  const ac = document.getElementById('adminControls');
  if(ac) ac.style.display = (v === 'all') ? 'flex' : 'none';
  render();
}

function setSearchQuery(v){
  searchQuery = v;
  render();
}

function updateLoginButtons(){
  ['all','satijapaper@gmail.com','poojasatijapaper@gmail.com'].forEach(v => {
    const id = v === 'all' ? 'btn-all' : (v === 'satijapaper@gmail.com' ? 'btn-sandeep' : 'btn-pooja');
    const el = document.getElementById(id);
    if(el) el.className = (v === currentUser) ? 'btn small' : 'btn ghost small';
  });
}

let adminTab = 'pending';
let searchQuery = '';

function visibleOrders(){
  let base = orders;
  if(searchQuery.trim()){
    const q = searchQuery.trim().toLowerCase();
    return base.filter(o => o.id.toLowerCase().includes(q) || o.mill.toLowerCase().includes(q));
  }
  const done = base.filter(o => currentStepIndex(o) >= STEPS.length);
  const notDone = base.filter(o => currentStepIndex(o) < STEPS.length);
  if(currentUser === 'all') return adminTab === 'completed' ? done : notDone;
  return notDone.filter(o => STEPS[currentStepIndex(o)].doerEmail === currentUser);
}

function setAdminTab(tab){
  adminTab = tab;
  try{
    document.getElementById('btn-tab-pending').className = tab === 'pending' ? 'btn small' : 'btn ghost small';
    document.getElementById('btn-tab-completed').className = tab === 'completed' ? 'btn small' : 'btn ghost small';
  }catch(e){
    console.error('button style update failed', e);
  }
  render();
}

function render(){
  if(!signedIn) return;
  renderStats();
  renderPanel();
}

function renderStats(){
  const vis = visibleOrders();
  const open = vis.length;
  const overdue = vis.filter(o => isStepOverdue(o, currentStepIndex(o))).length;
  const mismatches = vis.filter(orderHasMismatch).length;
  const openLabel = (currentUser === 'all' && adminTab === 'completed') ? 'Completed orders' : 'Pending orders';
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="num">${open}</div><div class="lbl">${openLabel}</div></div>
    <div class="stat ${overdue>0?'danger':''}"><div class="num">${overdue}</div><div class="lbl">Overdue right now</div></div>
    <div class="stat ${mismatches>0?'warn':''}"><div class="num">${mismatches}</div><div class="lbl">Qty mismatches</div></div>
  `;
}

// PO3's full confirmation UI (item qty + transport + invoice + costs), shared
// by the compact task-card view and the full order-detail view so both stay
// in sync. Insurance/Freight prefill from the order-level value backfilled
// from the Purchase Form, with a hint showing that source value alongside
// the box being confirmed.
function po3ConfirmSection(o){
  const invRows = o.items.map(it => `
      <div class="inv-row">
        <span style="flex:1;">${it.product}<span class="field-hint">Order qty tha: ${it.orderQty} ${it.unit}</span></span>
        <input type="number" id="inv-${o.id}-${it.id}" value="${it.orderQty}" step="0.01">
      </div>`).join('');

  const fieldGroup = (title, fields) => {
    const inputs = fields.map(([field,label,type]) => {
      const isCost = field === 'insurance' || field === 'freight';
      const prefill = isCost ? (o[field] || '') : '';
      const hint = isCost && o[field] ? `<span class="field-hint">Purchase Form mein: ${fmtMoney(o[field])}</span>` : '';
      return `<div class="field"><label>${label}</label><input type="${type||'text'}" id="fld-${o.id}-PO3-${field}" value="${prefill}">${hint}</div>`;
    }).join('');
    return `<div class="confirm-group">${title}</div><div class="field-grid">${inputs}</div>`;
  };

  return `<div class="confirm-box">
    <div class="confirm-group">Invoice qty &middot; item-wise</div>
    ${invRows}
    ${fieldGroup('Transport', [['vehicleNumber','Vehicle number'], ['driverNumber','Driver number'], ['transporterName','Transporter name']])}
    ${fieldGroup('Invoice', [['invoiceNumber','Invoice number'], ['invoiceDate','Invoice date','date'], ['invoiceCreditDays','Credit days','number'], ['invoiceAmount','Invoice amount','number'], ['transferStatus','Transfer status']])}
    ${fieldGroup('Costs &middot; confirm from Purchase Form', [['insurance','Insurance','number'], ['freight','Freight','number']])}
  </div>`;
}

function renderTaskCard(o){
  const idx = currentStepIndex(o);
  const s = STEPS[idx];
  const st = o.steps[s.key];
  const overdue = isStepOverdue(o, idx);
  const itemsLine = o.items.map(it => `${it.product} (${it.orderQty} ${it.unit})`).join(', ');

  const docInputs = s.docs.map(d => {
    const safe = d.replace(/\s+/g,'_');
    return `<div class="doc-row">
      <span>${d}</span>
      <input type="file" id="doc-${o.id}-${s.key}-${safe}" onchange="handleFileSelect(event,'${o.id}','${s.key}','${d}')">
      <span class="ts" id="docstat-${o.id}-${s.key}-${safe}" style="min-width:80px;"></span>
    </div>`;
  }).join('');
  const po3Section = s.key === 'PO3' ? po3ConfirmSection(o) : '';
  const po4Fields = s.key === 'PO4' ? `<div class="doc-row"><span>Driver status</span><input type="text" id="fld-${o.id}-PO4-driverStatus"></div>` : '';

  return `<div class="task-card ${overdue?'overdue':''}">
    <div class="task-head">
      <span class="task-pid">${o.id}</span>
      <span class="badge ${overdue?'danger':'warn'}">${s.key} \u00b7 ${s.label}${overdue?' \u00b7 overdue':''}</span>
    </div>
    <div class="task-sub">${o.mill} &middot; Planned: ${fmtDate(st.planned)} ${delayText(st)}</div>
    <div class="task-items">${itemsLine}</div>
    ${po3Section}${po4Fields}${docInputs}
    <button class="btn small" style="margin-top:8px;" onclick="completeStep('${o.id}','${s.key}')">Mark done</button>
  </div>`;
}

function renderPanel(){
  const panel = document.getElementById('panel');
  const vis = visibleOrders();
  if(orders.length === 0){
    panel.innerHTML = `<div class="empty"><div class="big">No purchase orders yet</div>Use the Purchase Form to create a new order.<br><br><a class="btn" href="https://script.google.com/a/macros/satijapaper.com/s/AKfycbxQNUAtVUGNGBNQBH6sQy_67tmCyiruYf9-quHGxNQKKTkzs9ZeBIIQvV7DEOBCN6m9/exec" target="_blank" style="text-decoration:none;">Fill Purchase Form &#8599;</a></div>`;
    return;
  }
  if(vis.length === 0){
    const msg = (currentUser === 'all' && adminTab === 'completed' && !searchQuery.trim())
      ? 'No orders have been fully completed yet.'
      : 'All orders are complete or belong to someone else.';
    panel.innerHTML = `<div class="empty"><div class="big">Nothing here</div>${msg}</div>`;
    return;
  }
  if(currentUser !== 'all'){
    const myStepKeys = STEPS.filter(s => s.doerEmail === currentUser).map(s => s.key);
    let html = '';
    let anyWork = false;
    myStepKeys.forEach(stepKey => {
      const stepDef = STEPS.find(s => s.key === stepKey);
      const forStep = vis.filter(o => STEPS[currentStepIndex(o)].key === stepKey);
      if(forStep.length === 0) return;
      anyWork = true;
      html += `<div style="margin:22px 0 10px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:600;">${stepKey} \u00b7 ${stepDef.label} <span class="mono" style="text-transform:none; letter-spacing:0;">(${forStep.length})</span></div>`;
      html += forStep.map(o => renderTaskCard(o)).join('');
    });
    if(!anyWork){
      html = `<div class="empty"><div class="big">No pending work</div>All steps are complete.</div>`;
    }
    panel.innerHTML = html;
    return;
  }
  let html = `<div class="row-head"><div></div><div>PO</div><div>Mill</div><div>Value</div><div>Progress</div><div>Current step</div><div></div></div>`;
  vis.forEach(o => {
    const idx = currentStepIndex(o);
    const done = idx >= STEPS.length;
    const overdue = !done && isStepOverdue(o, idx);
    const mismatch = orderHasMismatch(o);
    const isOpen = !!expanded[o.id];
    const stamps = STEPS.map((s,i) => {
      let cls = 'tick';
      if(o.steps[s.key].status === 'done') cls += ' done';
      else if(i === idx && overdue) cls += ' overdue';
      return `<div class="${cls}" title="${s.label}"></div>`;
    }).join('');
    let statusBadge;
    if(done) statusBadge = `<span class="badge ok">Completed</span>`;
    else if(overdue) statusBadge = `<span class="badge danger">Overdue \u00b7 ${STEPS[idx].label}</span>`;
    else statusBadge = `<span class="badge warn">${STEPS[idx].label}</span>`;

    html += `
    <div class="order-row">
      <div class="order-summary" onclick="toggleExpand('${o.id}')">
        <div class="chev ${isOpen?'open':''}">&#9656;</div>
        <div><div class="pid mono">${o.id}</div>${mismatch?'<div class="badge danger" style="margin-top:4px;">Qty mismatch</div>':''}</div>
        <div>${o.mill}</div>
        <div class="mono">${fmtMoney(orderValue(o))}</div>
        <div class="stamp">${stamps}</div>
        <div>${statusBadge}</div>
        <div></div>
      </div>
      <div class="detail ${isOpen?'open':''}" id="detail-${o.id}">
        ${renderDetail(o)}
      </div>
    </div>`;
  });
  panel.innerHTML = html;
}

function renderDetail(o){
  const idx = currentStepIndex(o);
  let legacyNote = '';
  if(o._legacySharedInvoiceQty){
    legacyNote = `<div class="badge danger" style="margin-bottom:8px; display:block; width:fit-content;">The old FMS had one shared Invoice Qty: ${o._legacySharedInvoiceQty} Kg &mdash; how it split across ${o.items.length} items is unknown, so it is left blank here. Confirm item-wise below.</div>`;
  }

  const orderInfoRows = [
    ['GSTIN', o.gstin], ['Address', o.address], ['Phone', o.phone],
    ['Contact person', o.contactPerson], ['Payment terms', o.paymentTerms],
    ['Credit days', o.creditDays], ['Delivery destination', o.deliveryDestination],
    ['Delivery date', o.deliveryDate], ['Remarks', o.remarks]
  ].filter(([,v]) => v);
  let orderInfoHtml = '';
  if(orderInfoRows.length || o.pdfLink){
    orderInfoHtml = `<h4>Order details</h4><table class="items">` +
      orderInfoRows.map(([k,v]) => `<tr><td style="color:var(--ink-muted); width:160px;">${k}</td><td>${v}</td></tr>`).join('') +
      (o.pdfLink ? `<tr><td style="color:var(--ink-muted);">Original PO PDF</td><td><a href="${o.pdfLink}" target="_blank" class="doc-chip">View PDF &#8599;</a></td></tr>` : '') +
      `</table>`;
  }

  let itemsHtml = `<table class="items"><tr><th>Product</th><th>Order qty</th><th>Rate</th><th>Amount</th><th>Invoice qty</th></tr>`;
  o.items.forEach(i => {
    const hasInv = i.invoiceQty !== null && i.invoiceQty !== undefined;
    const mismatch = hasInv && i.invoiceQty !== i.orderQty;
    itemsHtml += `<tr>
      <td>${i.product}</td>
      <td class="mono">${i.orderQty} ${i.unit}</td>
      <td class="mono">${i.rate}</td>
      <td class="mono">${fmtMoney(i.orderQty*i.rate)}</td>
      <td class="mono ${mismatch?'mismatch':''}">${hasInv ? i.invoiceQty + ' ' + i.unit + (mismatch ? ' (diff ' + (i.invoiceQty-i.orderQty) + ')' : '') : '\u2014'}</td>
    </tr>`;
  });
  itemsHtml += `</table>`;

  let stepsHtml = `<div class="steps">`;
  let currentPanelHtml = '';
  STEPS.forEach((s,i) => {
    const st = o.steps[s.key];
    const overdue = st.status !== 'done' && Date.now() > st.planned;
    let cls = 'step-card';
    if(st.status === 'done') cls += ' done';
    else if(i === idx) cls += ' current';
    const plannedLine = `<div class="time">Planned: ${fmtDate(st.planned)}</div>`;
    const doneLine = (st.status === 'done'
      ? `<div class="time">Done: ${fmtDate(st.actual)}</div>`
      : `<div class="time ${overdue?'late':''}">Done: &mdash;${overdue?' (overdue)':''}</div>`) + delayText(st);
    let extraFieldsHtml = '';
    if(s.key === 'PO3'){
      const costLine = (confirmed, quoted) => {
        if(!confirmed) return '';
        const differs = quoted && Number(quoted) !== Number(confirmed);
        return fmtMoney(confirmed) + (differs ? ` (Purchase Form: ${fmtMoney(quoted)})` : '');
      };
      const rows = [['Vehicle', st.vehicleNumber], ['Driver', st.driverNumber], ['Transporter', st.transporterName],
        ['Invoice no.', st.invoiceNumber], ['Invoice date', st.invoiceDate], ['Credit days (invoice)', st.invoiceCreditDays],
        ['Invoice amount', st.invoiceAmount ? fmtMoney(st.invoiceAmount) : ''],
        ['Transfer status', st.transferStatus], ['Insurance', costLine(st.insurance, o.insurance)],
        ['Freight', costLine(st.freight, o.freight)]].filter(([,v]) => v);
      if(rows.length) extraFieldsHtml = `<div class="ts" style="margin-top:4px; line-height:1.6;">${rows.map(([k,v])=>`${k}: ${v}`).join('<br>')}</div>`;
    } else if(s.key === 'PO4'){
      const rows = [['Lead time', st.leadTime], ['Driver status', st.driverStatus]].filter(([,v]) => v);
      if(rows.length) extraFieldsHtml = `<div class="ts" style="margin-top:4px; line-height:1.6;">${rows.map(([k,v])=>`${k}: ${v}`).join('<br>')}</div>`;
    }
    let actionHtml = '';
    if(i === idx && st.status !== 'done'){
      actionHtml = `<div class="ts" style="margin-top:6px; color:var(--warn); font-weight:600;">Confirm details below &#8595;</div>`;
      const docInputs = s.docs.map(d => {
        const safe = d.replace(/\s+/g,'_');
        return `<div class="doc-row">
          <span>${d}</span>
          <input type="file" id="doc-${o.id}-${s.key}-${safe}" onchange="handleFileSelect(event,'${o.id}','${s.key}','${d}')">
          <span class="ts" id="docstat-${o.id}-${s.key}-${safe}" style="min-width:80px;"></span>
        </div>`;
      }).join('');
      const po3Section = s.key === 'PO3' ? po3ConfirmSection(o) : '';
      const po4Fields = s.key === 'PO4' ? `<div class="doc-row"><span>Driver status</span><input type="text" id="fld-${o.id}-PO4-driverStatus"></div>` : '';
      currentPanelHtml = `<div style="margin-top:14px; padding:14px 16px; border:1px solid var(--border); border-radius:10px; background:var(--surface);">
          <h4 style="margin:0 0 4px;">${s.key} &middot; ${s.label} &mdash; confirm karein</h4>
          ${po3Section}${po4Fields}${docInputs}
          <button class="btn small" style="margin-top:10px;" onclick="completeStep('${o.id}','${s.key}')">Mark done</button>
        </div>`;
    } else if(st.status === 'done' && s.docs.length){
      const chips = s.docs.map(d => {
        const has = st.docs && st.docs[d];
        return has ? `<a href="#" onclick="viewDoc('${o.id}','${s.key}','${d}');return false;" class="doc-chip">${d} &#8599;</a>` : `<span class="doc-chip" style="opacity:.5;">${d} missing</span>`;
      }).join('');
      actionHtml = `<div style="margin-top:6px;">${chips}</div>`;
    }
    stepsHtml += `<div class="${cls}"><div class="name">${s.key} \u00b7 ${s.label}</div><div class="ts" style="font-size:11px; color:var(--ink-faint); margin-top:2px;">${s.doerName}</div>${plannedLine}${doneLine}${extraFieldsHtml}${actionHtml}</div>`;
  });
  stepsHtml += `</div>`;

  return `${legacyNote}${orderInfoHtml}<h4>Items</h4>${itemsHtml}<h4>Steps</h4>${stepsHtml}${currentPanelHtml}`;
}

function handleFileSelect(evt, orderId, stepKey, docLabel){
  const file = evt.target.files[0];
  const safe = docLabel.replace(/\s+/g,'_');
  const statusEl = document.getElementById(`docstat-${orderId}-${stepKey}-${safe}`);
  if(!file) return;
  if(file.size > 4 * 1024 * 1024){
    if(statusEl) statusEl.textContent = 'File too large (max 4MB)';
    evt.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    pendingDocs[orderId] = pendingDocs[orderId] || {};
    pendingDocs[orderId][stepKey] = pendingDocs[orderId][stepKey] || {};
    pendingDocs[orderId][stepKey][docLabel] = {dataUrl: reader.result, name: file.name};
    if(statusEl) statusEl.textContent = `\u2713 ${file.name}`;
  };
  reader.onerror = () => { if(statusEl) statusEl.textContent = 'Upload failed'; };
  reader.readAsDataURL(file);
}

async function viewDoc(orderId, stepKey, docLabel){
  const o = orders.find(x => x.id === orderId);
  const docInfo = o && o.steps[stepKey].docs && o.steps[stepKey].docs[docLabel];
  if(docInfo && docInfo.url){
    window.open(docInfo.url, '_blank');
    return;
  }
  try{
    const key = `doc:${orderId}:${stepKey}:${docLabel}`;
    const r = await window.storage.get(key, false);
    if(!r){ alert('Document not found'); return; }
    const res = await fetch(r.value);
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    window.open(blobUrl, '_blank');
  }catch(e){
    alert('Could not load the document');
  }
}

function toggleExpand(id){
  expanded[id] = !expanded[id];
  render();
}

async function completeStep(orderId, stepKey){
  const o = orders.find(x => x.id === orderId);
  if(!o) return;
  const stepDef = STEPS.find(s => s.key === stepKey);

  if(stepKey === 'PO3'){
    o.items.forEach(it => {
      const el = document.getElementById(`inv-${orderId}-${it.id}`);
      if(el && el.value !== '') it.invoiceQty = parseFloat(el.value);
    });
    ['vehicleNumber','driverNumber','transporterName','invoiceNumber','invoiceDate','invoiceCreditDays','invoiceAmount','transferStatus','insurance','freight'].forEach(field => {
      const el = document.getElementById(`fld-${orderId}-PO3-${field}`);
      if(el && el.value !== '') o.steps.PO3[field] = ['invoiceCreditDays','invoiceAmount','insurance','freight'].includes(field) ? parseFloat(el.value) : el.value;
    });
  }
  if(stepKey === 'PO4'){
    const el = document.getElementById(`fld-${orderId}-PO4-driverStatus`);
    if(el && el.value !== '') o.steps.PO4.driverStatus = el.value;
    if(o.steps.PO3 && o.steps.PO3.actual){
      const days = Math.round((Date.now() - o.steps.PO3.actual) / (24*3600*1000) * 10) / 10;
      o.steps.PO4.leadTime = days + ' day' + (days === 1 ? '' : 's');
    }
  }

  const uploaded = (pendingDocs[orderId] && pendingDocs[orderId][stepKey]) || {};
  let missing = [];
  stepDef.docs.forEach(d => { if(!uploaded[d]) missing.push(d); });
  if(missing.length){
    if(!confirm(`${missing.join(', ')} not uploaded. Complete this step anyway without the document?`)) return;
  }

  const docsFlag = {};
  for(const d of Object.keys(uploaded)){
    try{
      const result = await backendUploadDoc(orderId, stepKey, d, uploaded[d].name, uploaded[d].dataUrl.split(';')[0].split(':')[1], uploaded[d].dataUrl);
      docsFlag[d] = { name: uploaded[d].name, url: result.url || null };
    }catch(e){
      console.error('doc save failed', e);
    }
  }

  o.steps[stepKey].status = 'done';
  o.steps[stepKey].actual = Date.now();
  if(Object.keys(docsFlag).length) o.steps[stepKey].docs = docsFlag;
  if(pendingDocs[orderId]) delete pendingDocs[orderId][stepKey];
  await saveOrder(o);
  render();
}



document.getElementById('panel').innerHTML = '<div class="empty"><div class="big">Please sign in first</div>Your data will appear after signing in with the Google button above.</div>';
window.addEventListener('load', initGoogleSignIn);
loadOrders();
// Keep the Sheet in sync automatically - once shortly after opening, then
// every few minutes while the tab stays open. No more manual clicking.
setTimeout(() => runSync(false), 4000);
setInterval(() => runSync(false), 5 * 60 * 1000);
</script>
